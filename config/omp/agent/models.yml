          mode: anthropic-adaptive
          efforts: [high, xhigh, max]
          defaultLevel: high
          supportsDisplay: true
          requiresEffort: true
      - id: databricks-claude-haiku-5-5
        name: Claude-Haiku-5.5
        reasoning: true
        contextWindow: 160000
        maxOutputTokens: 16000
        thinking:
          mode: anthropic-adaptive
          efforts: [xhigh]
          defaultLevel: xhigh
          supportsDisplay: true
          requiresEffort: true
