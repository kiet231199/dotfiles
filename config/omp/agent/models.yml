providers:
  gen-ai-claude:
    baseUrl: BaseUrl
    apiKey: Token
    api: anthropic-messages
    auth: apiKey
    disableStrictTools: true
    compat:
      supportsContextManagement: false
    models:
      - id: databricks-claude-opus-5-5
        name: Claude-Opus-5.5
        reasoning: true
        contextWindow: 160000
        maxOutputTokens: 16000
